<!doctype html>
<html lang="en-GB">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #221e1f;
    "
  >
    <div style="max-width: 480px; margin: 0 auto">
      <p style="font-size: 18px; margin: 0 0 16px">
        Here's your Paper Fox sign-in code:
      </p>
      <p
        style="
          font-size: 36px;
          letter-spacing: 8px;
          font-weight: bold;
          margin: 0 0 16px;
          background: #e8e2da;
          padding: 16px;
          text-align: center;
          border-radius: 8px;
        "
      >
        {{ .Token }}
      </p>
      <p style="margin: 0 0 16px">
        Type it into the sign-in page. It works for 10 minutes.
      </p>
      <p style="margin: 0 0 16px">
        If you didn't ask for this, you can ignore this email.
      </p>
      <p style="margin: 0">Nichola &amp; Morag<br />Paper Fox</p>
    </div>
  </body>
</html>
